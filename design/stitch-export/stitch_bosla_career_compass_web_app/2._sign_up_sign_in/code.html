<body class="bg-surface text-on-surface min-h-screen flex flex-col justify-between antialiased selection:bg-surface-container selection:text-primary">
<!-- Minimal Top Header Anchor (Non-shell linear flow) -->
<header class="w-full py-6 px-8 flex justify-between items-center max-w-7xl mx-auto">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary inline-block"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">Precision Navigation</span>
</div>
<div class="flex items-center gap-4">
<span class="font-label-sm text-label-sm text-outline">v2.4.0</span>
</div>
</header>
<!-- Central Authentication Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-4 py-8">
<div class="w-full max-w-[420px]">
<!-- Primary Card Container (Flat Container Standard, Hairline Border) -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-8">
<!-- Centered Logo Lockup -->
<div class="flex justify-center mb-6">
<img alt="Bosla compass-rose brandmark" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDDMjlRTM4fZYyurKFBf3iPgnT3QfZAn6y3cNNz1CKC-vPPorJL1vTRHqyge6OYw8_vW2uQuQyuT_zo393Q01Nln_Eghrgq_y3Hw4AvX5-VJ1ftXcfAfI9CisyiIyzM6aJTk6gY7u5-q9o8JTETe_bGPN8UXxhse3qPLC-LnHaavQvltm677-0dKSXL6ZjNpM_gyzCGUjMHxDMYcGrRUqILFcnfWIJtTKFs2uqxubsWn9e8FSB-Dg9ZVbvhPjeqzsEmcA"/>
</div>
<!-- Typography Header Group -->
<div class="text-left mt-6 mb-6">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-semibold text-primary mb-2">
            Create your account
          </h1>
<p class="font-body-md text-body-md text-secondary">
            Start uncovering your career direction.
          </p>
</div>
<!-- Registration Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-primary font-medium tracking-[0.06em] uppercase mb-1.5" for="email">
              Email
            </label>
<input class="w-full h-10 px-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-primary placeholder:text-outline font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-0 transition-colors" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block font-label-md text-label-md text-primary font-medium tracking-[0.06em] uppercase" for="password">
                Password
              </label>
<span class="font-label-sm text-label-sm text-outline">8+ characters</span>
</div>
<input class="w-full h-10 px-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-primary placeholder:text-outline font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-0 transition-colors tracking-widest" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full h-10 bg-primary text-on-primary font-body-md-medium text-body-md-medium rounded-lg hover:bg-primary-container transition-colors flex items-center justify-center active:opacity-90" type="submit">
              Continue
            </button>
</div>
</form>
<!-- Divider -->
<div class="relative my-6 flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative bg-surface-container-lowest px-3">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">or</span>
</div>
</div>
<!-- Secondary SSO Action -->
<button class="w-full h-10 bg-surface-container-lowest border border-outline-variant rounded-lg text-primary font-body-md-medium text-body-md-medium hover:bg-surface-container-low hover:border-primary transition-colors flex items-center justify-center gap-3 active:opacity-85" type="button">
<!-- Google G Icon (Precision Vector) -->
<svg aria-hidden="true" class="w-4 h-4" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
          Continue with Google
        </button>
</div>
<!-- Linear Routing Link (Outside Card) -->
<div class="text-center mt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
          Already have an account? 
          <a class="font-body-md-medium text-body-md-medium text-secondary hover:underline underline-offset-4 ml-1" href="#">
            Sign in
          </a>
</p>
</div>
</div>

<!-- Quiet Editorial Footer -->
<footer class="w-full py-6 px-8 text-center">
<div class="flex items-center justify-center gap-6 font-label-sm text-label-sm text-outline">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span>System Status: Optimal</span>
</div>
</footer>
